services:
  fe:
    build:
      context: .
      dockerfile: Dockerfile
    image: fe_fieldbooking:latest
    container_name: fieldbooking-fe
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api-fieldbooking.ditooow.online/api}
